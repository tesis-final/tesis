# =============================================================================
# ATLAS — parámetros de atlas-srv01 (Fase 6). SIN SECRETOS: acá no va ninguna
# contraseña ni clave. Cada valor dice de dónde sale.
# =============================================================================

# --- Identidad y red (PDF Tabla 24, Tabla 38, Tabla 40) ---
ATLAS_HOSTNAME=atlas-srv01
ATLAS_DOMINIO=atlas.local                 # §29.1
ATLAS_REALM=ATLAS.LOCAL
ATLAS_WORKGROUP=ATLAS
ATLAS_IP=172.16.40.10
ATLAS_PREFIJO=24
ATLAS_GATEWAY=172.16.40.1                 # Tabla 38 (VLAN 40)
ATLAS_DNS=172.16.40.20                    # atlas-dc01, Tabla 40
ATLAS_DC_FQDN=atlas-dc01.atlas.local
# Interfaz de red. Vacío = se detecta sola (la primera interfaz Ethernet).
# En VirtualBox suele ser enp0s3.
ATLAS_IFACE="${ATLAS_IFACE:-}"
# "si" aplica la IP fija con netplan. Poner "no" mientras la VM use el
# adaptador NAT de VirtualBox para instalar paquetes (ver manual, paso 3).
ATLAS_APLICAR_RED="${ATLAS_APLICAR_RED:-si}"
ATLAS_ZONA_HORARIA=America/Montevideo

# --- Redes de origen permitidas (Tabla 44, DEC-05) ---
RED_ADMIN=172.16.10.0/24                  # VLAN 10
RED_DOCENTES=172.16.20.0/24               # VLAN 20
RED_ESTUDIANTES=172.16.30.0/24            # VLAN 30
RED_SERVIDORES=172.16.40.0/24             # VLAN 40
RED_GESTION=172.16.50.0/24                # VLAN 50
RED_VPN_DOCENTES=10.8.0.128/25            # Tabla 45
IP_DC=172.16.40.20

# --- Estructura (§28.3) ---
ATLAS_ROOT=/srv/atlas

# --- Acceso de emergencia (DEC-07) ---
# Archivo con la clave PÚBLICA de atlasadmin (la privada nunca sale de la
# estación de administración). El script 02 la copia a authorized_keys.
ATLAS_CLAVE_PUBLICA_ADMIN=/root/atlasadmin.pub

# --- Dominio (Fase 7) ---
# OU donde se crea la cuenta de equipo de atlas-srv01 (§29.2).
ATLAS_OU_EQUIPO="OU=Servidores,OU=ATLAS,DC=atlas,DC=local"
# Grupos de AD tal como los muestra SSSD (en minúsculas, sin dominio).
AD_GRUPO_SOPORTE=gg_soporteti
AD_GRUPO_ADMINISTRACION=gg_administracion
AD_GRUPO_DOCENTES=gg_docentes
