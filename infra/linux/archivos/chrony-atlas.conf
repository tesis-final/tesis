# ATLAS — /etc/chrony/conf.d/atlas.conf (Tabla 35: "Hora: NTP desde el controlador de dominio")
# Kerberos rechaza la autenticación si los relojes difieren más de 5 minutos (§29.5).
# El DC es la fuente de hora del dominio con su propio reloj (DEC-R8, DISC-20).
server 172.16.40.20 iburst
# Si el reloj está muy corrido al arrancar, se corrige de golpe en los primeros ajustes.
makestep 1.0 3
