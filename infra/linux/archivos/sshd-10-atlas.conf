# =============================================================================
# ATLAS — /etc/ssh/sshd_config.d/10-atlas.conf
# PDF §28.4 (literal) + DEC-07 (Soporte TI entra con su cuenta de AD).
# Lo que está en este archivo manda sobre /etc/ssh/sshd_config (se lee primero).
# Probar SIEMPRE antes de recargar:  sudo sshd -t
# =============================================================================

# --- §28.4, literal ---
PermitRootLogin no
PasswordAuthentication no
PubkeyAuthentication yes
AllowGroups atlas-admin
AllowUsers atlasadmin@172.16.50.*
MaxAuthTries 3

# --- Endurecimiento complementario (misma intención: menos superficie) ---
KbdInteractiveAuthentication no
PermitEmptyPasswords no
# Cuentas de AD: entran con su ticket de Kerberos, sin contraseña por SSH (DEC-07).
GSSAPIAuthentication yes
GSSAPICleanupCredentials yes
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
ClientAliveInterval 300
ClientAliveCountMax 2
# VERBOSE deja en el log la huella de la clave usada en cada ingreso (auditoría).
LogLevel VERBOSE
Banner /etc/issue.net

# --- DEC-07: solo desde la VLAN de Gestión (Tabla 43: "Gestión llega a todos lados") ---
# Dentro de la VLAN 50 se permite, además de atlasadmin, a los miembros de
# GG_SoporteTI (grupo de AD que SSSD muestra como gg_soporteti). Desde cualquier
# otra red rige lo de arriba: AllowUsers atlasadmin@172.16.50.* → nadie entra.
Match Address 172.16.50.0/24
    AllowUsers *
    AllowGroups atlas-admin gg_soporteti
    # Túnel local para abrir la interfaz de Zabbix desde VLAN 50 (DEC-19).
    AllowTcpForwarding local
