# =============================================================================
# ATLAS — ajustes para PROBAR en una PC (no se usa en el servidor).
# Toma el código directamente del repositorio en lugar de /srv/atlas (§28.3).
# Lo usa ../probar-local.sh:
#   docker compose --env-file local/atlas.conf -f docker-compose.yml -f docker-compose.local.yml up -d --build
# =============================================================================
services:
  atlas-web:
    volumes:
      - ./public:/srv/atlas/web/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./local/tls:/etc/nginx/tls:ro

  atlas-php:
    build:
      context: .
    volumes:
      - ./public:/srv/atlas/web/public:ro
      - ./:/srv/atlas/web/app:ro
      - ./local/logs:/srv/atlas/logs

  atlas-db:
    volumes:
      - ./local/datos:/var/lib/mysql
      - ./database:/atlas/database:ro
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/mysql/02-usuarios.sh:/docker-entrypoint-initdb.d/02-usuarios.sh:ro

  atlas-analysis:
    build:
      context: ../atlas-analysis
