# ATLAS — atlas-web (nginx:alpine, PDF Tabla 15; DEC-01).
# Solo se expone public/ (§26.2). La API y la interfaz pasan por public/index.php.

# La red de ATLAS es solo IPv4 (172.16.0.0/16, §30.1): no se escucha en IPv6.
server_tokens off;

# El puerto 80 solo redirige a HTTPS. Desde la red no está permitido (Tabla 44, DEC-05).
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name atlas-srv01.atlas.local 172.16.40.10;

    # Certificado emitido por ATLAS-CA (DEC-20).
    ssl_certificate     /etc/nginx/tls/atlas.crt;
    ssl_certificate_key /etc/nginx/tls/atlas.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ATLAS:10m;
    ssl_session_timeout 1h;

    root /srv/atlas/web/public;
    index index.php;
    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Recursos estáticos
    location ~* \.(css|js|svg|png|ico|woff2?)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'" always;
    }

    # Archivos ocultos y cualquier otro .php: nunca
    location ~ /\. { deny all; }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass atlas-php:9000;
        fastcgi_param SCRIPT_FILENAME /srv/atlas/web/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ { return 404; }
}
