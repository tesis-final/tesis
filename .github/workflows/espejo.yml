name: Espejo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  espejo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Empujar al repositorio de la otra cuenta
        env:
          TOKEN: ${{ secrets.ESPEJO_TOKEN }}
        run: |
          git push --force \
            "https://x-access-token:${TOKEN}@github.com/error404tech/atlas.git" \
            HEAD:refs/heads/main
