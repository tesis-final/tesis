 <!-- leyenda -->
 <rect x="30" y="230" width="290" height="300" rx="10" fill="#fff" stroke="#9aa9bd"/>
 <text x="44" y="254" class="t">Cómo leer el diagrama</text>
 <text x="44" y="278" class="s">· Todo lo que va de una VLAN a otra</text><text x="44" y="296" class="s">  pasa por router-lab (firewall).</text>
 <text x="44" y="320" class="s">· Dentro de una VLAN el tráfico</text><text x="44" y="338" class="s">  queda en vmbr1.</text>
 <text x="44" y="362" class="s">· No hay NAT de entrada: desde</text><text x="44" y="380" class="s">  afuera solo se entra por la VPN.</text>
 <text x="44" y="404" class="s">· La PC llega a la WAN del router</text><text x="44" y="422" class="s">  con una ruta a 10.99.0.0/24</text><text x="44" y="440" class="s">  por 192.168.2.2.</text>
 <text x="44" y="464" class="s">· Monitoreo y respaldos no cruzan</text><text x="44" y="482" class="s">  el router: srv01 y dc01 están en</text><text x="44" y="500" class="s">  la misma VLAN 40.</text>
